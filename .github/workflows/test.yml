name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Num-Back
    env:
      NODE_ENV: test
      SECRETORPRIVATEKEY: test_secret_key_12345_for_testing_only
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: ./Num-Back/node_modules
          key: ${{ runner.os }}-backend-${{ hashFiles('**/Num-Back/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-backend-

      - name: Install dependencies
        run: npm ci
        timeout-minutes: 10

      - name: Run tests
        run: npm test
        timeout-minutes: 15
        env:
          JEST_TIMEOUT: 30000

  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Num-Front
    env:
      NODE_ENV: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: ./Num-Front/node_modules
          key: ${{ runner.os }}-frontend-${{ hashFiles('**/Num-Front/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-frontend-

      - name: Install dependencies
        run: npm ci
        timeout-minutes: 10

      - name: Run tests
        run: npm test
        timeout-minutes: 10
