name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Num-Back
    env:
      NODE_ENV: test
      SECRETORPRIVATEKEY: test_secret_key_12345_for_testing_only
      RESEND_API_KEY: re_test_dummy_key_for_testing
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: List files in Num-Back
        run: ls -la

      - name: Check package.json
        run: cat package.json

      - name: Install dependencies
        run: npm install --legacy-peer-deps
        timeout-minutes: 10

      - name: List node_modules
        run: ls node_modules | head -20

      - name: Run tests
        run: npm test -- --verbose --no-coverage --detectOpenHandles
        timeout-minutes: 15

  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Num-Front
    env:
      NODE_ENV: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: List files in Num-Front
        run: ls -la

      - name: Check package.json
        run: cat package.json

      - name: Install dependencies
        run: npm install --legacy-peer-deps
        timeout-minutes: 10

      - name: List node_modules
        run: ls node_modules | head -20

      - name: Run tests
        run: npm test -- --verbose --no-coverage
        timeout-minutes: 10
